name: Web Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run UI Contract and Role Visibility Fast Checks
        run: npm run test -- --run src/layout/AppLayout.test.jsx src/components/PermissionRoute.test.jsx src/utils/apiError.test.js

      - name: Run Full Tests
        run: npm run test -- --run

      - name: Build
        run: npm run build
